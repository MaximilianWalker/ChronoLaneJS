version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/examples/vite"
      - "/examples/next"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - MaximilianWalker
    commit-message:
      prefix: "chore(deps)"
    groups:
      routine-npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-npm:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - MaximilianWalker
    commit-message:
      prefix: "chore(actions)"
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
